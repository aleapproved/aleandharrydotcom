name: pages

# Checks the site, then publishes it to Cloudflare Pages. The two are one
# workflow because they are one decision: nothing reaches aleandharry.com that
# the checks have not passed. Run separately they raced, and the deploy
# usually won.
#
# The site is hand-written static HTML with no build step, so the deploy stages
# the files that make up the site and uploads them. Staging rather than
# uploading the repo root keeps the checks, the badge tooling and the worker's
# source off the public site: they belong in the repo, not at
# aleandharry.com/worker/src/index.js.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Queue pushes rather than cancelling the one in flight, so a cancelled deploy
# cannot leave a half-uploaded site published. Keyed by ref so a pull request
# waits behind its own runs and not behind a deploy of main.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test

  deploy:
    needs: check
    # A pull request gets the checks and stops there; only main publishes.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # git archive, not a copy of the working tree: it emits committed files
      # and nothing else, so anything gitignored cannot reach the site even by
      # accident. An earlier exclude-list version of this swept .env into the
      # upload, which would have published every token in it.
      - name: Stage the site
        run: |
          mkdir _site
          git archive HEAD | tar -x -C _site
          rm -rf _site/.github _site/test _site/tools _site/worker
          rm -f _site/*.md _site/package.json _site/package-lock.json _site/.gitignore
          for source in \
            "mudkiphanddrawnbyale.jpg" "chansey.png" "lapras.png" \
            "bellibolt.jpg" "mudkip (1).jpg" "solrock.jpg" "lunatone.jpg" "ditto.jpg"; do
            rm -f "_site/images/$source"
          done

      # The pages revalidate on every load but the stylesheet and the scripts
      # are cached for four hours, so a deploy that changes both left visitors
      # running new markup against old CSS. It shipped photos wrapped in
      # unstyled buttons and an unstyled dialog: little grey boxes, and a white
      # one with scrollbars. Stamping the content hash into the URL makes the
      # two land together, since a page can only ask for the CSS it was built
      # with. Local files keep plain names; only what is published is stamped.
      - name: Version the assets
        run: |
          for asset in styles.css game.css theme-toggle.js countdown.js rsvp.js lightbox.js game.js; do
            v=$(sha256sum "_site/$asset" | cut -c1-10)
            sed -i "s|\"/$asset\"|\"/$asset?v=$v\"|g" _site/*.html
          done
          # A page that still asks for a bare name would be the same bug again.
          if grep -lE '"/[a-z-]+\.(css|js)"' _site/*.html; then
            echo "::error::the files above reference an unversioned asset"
            exit 1
          fi

      - uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # Not a secret: the account ID identifies the account but authorises
          # nothing without the token above, and Cloudflare puts it in dashboard
          # URLs. Naming it here beats a second repo secret to keep in sync.
          accountId: 010ccfd71330e904562ca7fa44707d68
          command: pages deploy _site --project-name=aleandharry --branch=main

  deploy-worker:
    needs: check
    # The Worker and Pages must advance together on main. Pull requests still
    # get the worker module checks without changing the live Airtable endpoint.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 010ccfd71330e904562ca7fa44707d68
          workingDirectory: worker
          command: deploy
