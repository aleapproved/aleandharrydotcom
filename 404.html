<!DOCTYPE html>
<html lang="en" data-paper="#f7ecdd" data-paper-dark="#1b1830">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page not found &ndash; Ale &amp; Harry</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="/images/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <meta name="theme-color" content="#f7ecdd">
  <script>
    (function () {
      try {
        var root = document.documentElement;
        var saved = localStorage.getItem('theme');
        var theme = saved === 'dark' || saved === 'light' ? saved
          : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        root.setAttribute('data-theme', theme);
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', theme === 'dark' ? root.dataset.paperDark : root.dataset.paper);
      } catch (e) {}
    })();
  </script>
  <link rel="preload" href="/fonts/InterVariable.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="site-header">
    <a href="/" class="brand">Ale <span class="amp">&amp;</span> Harry</a>
    <div class="nav-group">
      <nav>
        <a href="/">Home</a>
        <a href="/our-story">Hale</a>
        <a href="/the-day">The Day</a>
        <a href="/travel">Travel</a>
        <a href="/rsvp">RSVP</a>
      </nav>
      <button id="themeToggle" class="theme-toggle" aria-label="Dark mode" aria-pressed="false" type="button">
        <img class="theme-icon-light" src="/images/solrock-icon.png" alt="" aria-hidden="true">
        <img class="theme-icon-dark" src="/images/lunatone-icon.png" alt="" aria-hidden="true">
      </button>
    </div>
  </header>
  <main class="centered">
    <h1 class="eyebrow">404</h1>
    <p class="quote">&ldquo;There&rsquo;s a time and place for everything, but not now.&rdquo;</p>
    <div class="rule"></div>
    <p><a href="/">Take me back</a></p>
  </main>
  <footer class="site-footer">
    <p>Any questions, ask us: <a href="mailto:rsvp@aleandharry.com">rsvp@aleandharry.com</a></p>
  </footer>
  <script src="/theme-toggle.js" defer></script>
</body>
</html>
